name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** report security vulnerabilities here. See SECURITY.md.
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, description: "Taveloom (Windows), Android app, Windows build, Android version, phone model" }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Anything else, description: "Screenshots, error text. Remove IP addresses and device names you do not want to share." }
