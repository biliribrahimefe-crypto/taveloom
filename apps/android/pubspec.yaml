name: taveloom
description: Taveloom - turn your Android phone into an adaptive control surface for your Windows PC.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
